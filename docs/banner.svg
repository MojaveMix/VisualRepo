<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="VisualRepo — Evidence-Cited AI Codebase Explorer and Architecture Visualizer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#141b3a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="20" fill="url(#glow)"/>

  <!-- architecture graph decoration -->
  <g stroke="url(#accent)" stroke-width="2" opacity="0.55" fill="none">
    <path d="M880 80 L980 140"/>
    <path d="M880 80 L960 40"/>
    <path d="M980 140 L1080 100"/>
    <path d="M980 140 L1040 220"/>
    <path d="M1040 220 L1120 250"/>
    <path d="M1080 100 L1130 40"/>
  </g>
  <g fill="#0b1020" stroke="url(#accent)" stroke-width="3">
    <circle cx="880" cy="80" r="14"/>
    <circle cx="960" cy="40" r="10"/>
    <circle cx="980" cy="140" r="16"/>
    <circle cx="1080" cy="100" r="12"/>
    <circle cx="1040" cy="220" r="14"/>
    <circle cx="1120" cy="250" r="9"/>
    <circle cx="1130" cy="40" r="9"/>
  </g>

  <text x="60" y="130" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="68" font-weight="800" fill="url(#accent)">VisualRepo</text>
  <text x="60" y="185" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="30" font-weight="600" fill="#e2e8f0">Evidence-Cited AI Codebase Explorer</text>
  <text x="60" y="225" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="30" font-weight="600" fill="#e2e8f0">&amp; Architecture Visualizer</text>
  <text x="60" y="275" font-family="'Courier New', monospace" font-size="20" fill="#94a3b8">every claim cites file.ext : L12-L48</text>
</svg>
