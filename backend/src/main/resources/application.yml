spring:
  application:
    name: visualrepo-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/visualrepo?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

visualrepo:
  github:
    base-url: https://api.github.com
    token: ${GITHUB_TOKEN:}
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    chat-model: ${OLLAMA_CHAT_MODEL:qwen2.5-coder:7b}
    embed-model: ${OLLAMA_EMBED_MODEL:nomic-embed-text}
